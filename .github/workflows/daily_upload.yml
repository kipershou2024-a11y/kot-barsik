name: Daily Barsik Short Auto-Pilot

on:
  schedule:
    - cron: '0 10 * * *' # Every day at 10:00 UTC
    - cron: '0 18 * * *' # Every day at 18:00 UTC (8 hours later)
  workflow_dispatch:     # Allow manual trigger from GitHub UI

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache HuggingFace models and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: hf-sd-turbo-${{ runner.os }}-v1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install -r requirements-pipeline.txt

      - name: Restore yt_token.json from Secret
        run: |
          echo '${{ secrets.YT_TOKEN_JSON }}' > yt_token.json

      - name: Generate and upload episode (free CPU diffusion + Fish TTS)
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          IMAGE_BACKEND: local
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        run: |
          python auto_generator.py
