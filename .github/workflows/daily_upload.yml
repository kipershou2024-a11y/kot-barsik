name: Daily Barsik Short Auto-Pilot

on:
  schedule:
    - cron: '0 10 * * *' # Every day at 10:00 UTC - uploads one queued episode
  workflow_dispatch:     # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  upload-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore yt_token.json from Secret
        run: |
          echo '${{ secrets.YT_TOKEN_JSON }}' > yt_token.json

      - name: Upload next queued episode
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_JSON }}
        run: |
          python auto_generator.py upload

      - name: Commit queue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A queue
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Consume uploaded episode [skip ci]"
            git push
          fi
